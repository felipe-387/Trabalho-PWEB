<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="estilo.css">

    <title>PÁGINA DE LOGIN</title>

</head>

<body>


    <!-- LOGIN -->

    <form id="formLogin">

        <fieldset id="fie">

            <legend>LOGIN</legend>

            <p>
                <label for="loginEmail">Login (Email):</label>

                <input
                    type="email"
                    id="loginEmail"
                    maxlength="120"
                    autocomplete="email"
                    required
                >
            </p>

            <p>
                <label for="loginSenha">Senha:</label>

                <input
                    type="password"
                    id="loginSenha"
                    minlength="6"
                    maxlength="128"
                    autocomplete="current-password"
                    required
                >
            </p>

            <center>

                <button type="submit">
                    FAZER LOGIN
                </button>

            </center>

        </fieldset>

    </form>


    <!-- CADASTRO -->

    <form id="formCadastro">

        <fieldset id="cad">

            <legend>
                CASO NÃO TENHA LOGIN, CADASTRE-SE
            </legend>

            <p>
                <label for="cadastroNome">Nome:</label>

                <input
                    type="text"
                    id="cadastroNome"
                    maxlength="80"
                    autocomplete="name"
                    required
                >
            </p>

            <p>
                <label for="cadastroEmail">Email:</label>

                <input
                    type="email"
                    id="cadastroEmail"
                    maxlength="120"
                    autocomplete="email"
                    required
                >
            </p>

            <p>
                <label for="cadastroSenha">Senha:</label>

                <input
                    type="password"
                    id="cadastroSenha"
                    minlength="6"
                    maxlength="128"
                    autocomplete="new-password"
                    required
                >
            </p>

            <center>

                <button type="submit">
                    CADASTRE-SE
                </button>

                <input
                    type="reset"
                    value="Limpar"
                >

            </center>

        </fieldset>

    </form>


    <!-- ADMINISTRADOR -->

    <form id="formDelete">

        <fieldset id="delete">

            <legend>
                ADMINISTRADOR - GERENCIAR REGISTRO
            </legend>

            <p>

                <label for="deleteUsuario">
                    Escolha o usuário:
                </label>

                <select
                    id="deleteUsuario"
                    required
                >

                    <option value="">
                        Carregando usuários...
                    </option>

                </select>

            </p>

            <center>

                <button
                    type="button"
                    id="btnAlterar"
                >
                    ALTERAR
                </button>

                <button type="submit">
                    DELETAR REGISTRO
                </button>

            </center>

        </fieldset>

    </form>


    <script type="module">


        // =========================
        // IMPORTAÇÕES FIREBASE
        // =========================

        import {
            initializeApp
        }

        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


        import {

            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword

        }

        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        import {

            getFirestore,
            doc,
            setDoc,
            deleteDoc,
            collection,
            getDocs,
            query,
            where

        }

        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        // =========================
        // CONFIGURAÇÃO FIREBASE
        // =========================

        const firebaseConfig = {

            apiKey: "AIzaSyDTbM_zYLwr48RRTc-Vg075ftqJ5NfwOWQ",

            authDomain: "albano-2e9e7.firebaseapp.com",

            projectId: "albano-2e9e7",

            storageBucket: "albano-2e9e7.firebasestorage.app",

            messagingSenderId: "978832727853",

            appId: "1:978832727853:web:57663dfe584550eb06fda4"

        };


        // =========================
        // INICIALIZAÇÃO
        // =========================

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);


        // =========================
        // SANITIZAÇÃO
        // =========================

        function sanitizarTexto(valor) {

            return valor
                .trim()
                .replace(/\s+/g, " ");

        }


        // =========================
        // VALIDAÇÃO DO NOME
        // =========================

        function validarNome(nome) {

            return (
                nome.length >= 2 &&
                nome.length <= 80 &&
                !/[<>]/.test(nome)
            );

        }


        // =========================
        // VALIDAÇÃO DO EMAIL
        // =========================

        function validarEmail(email) {

            return (
                email.length <= 120 &&
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
            );

        }


        // =========================
        // VALIDAÇÃO DA SENHA
        // =========================

        function validarSenha(senha) {

            return (
                senha.length >= 6 &&
                senha.length <= 128
            );

        }


        // =========================
        // CADASTRO
        // =========================

        document
        .getElementById("formCadastro")
        .addEventListener("submit", async (e) => {

            e.preventDefault();


            const nome =
                sanitizarTexto(
                    document
                    .getElementById("cadastroNome")
                    .value
                );


            const email =
                document
                .getElementById("cadastroEmail")
                .value
                .trim()
                .toLowerCase();


            const senha =
                document
                .getElementById("cadastroSenha")
                .value;


            // VALIDAÇÃO

            if (!validarNome(nome)) {

                alert(
                    "Nome inválido. Use entre 2 e 80 caracteres."
                );

                return;

            }


            if (!validarEmail(email)) {

                alert(
                    "Digite um e-mail válido."
                );

                return;

            }


            if (!validarSenha(senha)) {

                alert(
                    "A senha deve ter entre 6 e 128 caracteres."
                );

                return;

            }


            try {

                /*
                 * SEGURANÇA:
                 *
                 * A senha NÃO é salva no Firestore.
                 *
                 * O Firebase Authentication é responsável
                 * pelo armazenamento seguro da credencial.
                 */

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        senha
                    );


                const user =
                    userCredential.user;


                // PERSISTÊNCIA DE DADOS

                await setDoc(

                    doc(
                        db,
                        "usuarios",
                        user.uid
                    ),

                    {

                        nome: nome,

                        email: email

                    }

                );


                alert(
                    "Usuário cadastrado com sucesso!"
                );


                document
                    .getElementById("formCadastro")
                    .reset();


                carregarUsuarios();


            } catch (error) {

                console.error(error);

                alert(
                    "Erro ao cadastrar: " +
                    error.message
                );

            }

        });


        // =========================
        // LOGIN
        // =========================

        document
        .getElementById("formLogin")
        .addEventListener("submit", async (e) => {

            e.preventDefault();


            const email =
                document
                .getElementById("loginEmail")
                .value
                .trim()
                .toLowerCase();


            const senha =
                document
                .getElementById("loginSenha")
                .value;


            if (!validarEmail(email)) {

                alert(
                    "Digite um e-mail válido."
                );

                return;

            }


            if (!validarSenha(senha)) {

                alert(
                    "Senha inválida."
                );

                return;

            }


            try {

                await signInWithEmailAndPassword(

                    auth,
                    email,
                    senha

                );


                window.location.href =
                    "site.html";


            } catch (error) {

                console.error(error);

                alert(
                    "Erro ao fazer login: " +
                    error.message
                );

            }

        });


        // =========================
        // READ
        // CARREGAR USUÁRIOS
        // =========================

        async function carregarUsuarios() {

            const select =
                document
                .getElementById(
                    "deleteUsuario"
                );


            try {

                const usuariosRef =
                    collection(
                        db,
                        "usuarios"
                    );


                const resultado =
                    await getDocs(
                        usuariosRef
                    );


                select.innerHTML = "";


                if (resultado.empty) {

                    const opcao =
                        document.createElement(
                            "option"
                        );


                    opcao.value = "";

                    opcao.textContent =
                        "Nenhum usuário cadastrado";


                    select.appendChild(
                        opcao
                    );


                    return;

                }


                resultado.forEach(
                    (usuario) => {

                        const dados =
                            usuario.data();


                        const opcao =
                            document.createElement(
                                "option"
                            );


                        opcao.value =
                            usuario.id;


                        /*
                         * PROTEÇÃO CONTRA XSS
                         *
                         * textContent trata o conteúdo
                         * como texto e não como HTML.
                         */

                        opcao.textContent =

                            sanitizarTexto(
                                dados.nome || ""
                            )

                            +

                            " - "

                            +

                            sanitizarTexto(
                                dados.email || ""
                            );


                        select.appendChild(
                            opcao
                        );

                    }
                );


            } catch (error) {

                console.error(error);


                select.innerHTML = "";


                const opcao =
                    document.createElement(
                        "option"
                    );


                opcao.value = "";

                opcao.textContent =
                    "Erro ao carregar usuários";


                select.appendChild(
                    opcao
                );

            }

        }


        // CARREGAR AO ABRIR

        carregarUsuarios();


        // =========================
        // WHERE
        // CONSULTA PARAMETRIZADA
        // =========================

        async function usuarioExistePorEmail(email) {

            const emailSeguro =
                email
                .trim()
                .toLowerCase();


            /*
             * CONSULTA COM WHERE
             *
             * O valor é passado como parâmetro
             * para a consulta.
             *
             * Não existe montagem de SQL.
             *
             * Equivalente conceitual:
             *
             * SELECT *
             * FROM usuarios
             * WHERE email = ?
             */

            const consulta =
                query(

                    collection(
                        db,
                        "usuarios"
                    ),

                    where(
                        "email",
                        "==",
                        emailSeguro
                    )

                );


            const resultado =
                await getDocs(
                    consulta
                );


            return !resultado.empty;

        }


        // =========================
        // UPDATE
        // ALTERAR USUÁRIO
        // =========================

        document
        .getElementById("btnAlterar")
        .addEventListener(
            "click",
            async () => {

                const select =
                    document
                    .getElementById(
                        "deleteUsuario"
                    );


                const uid =
                    select.value;


                if (!uid) {

                    alert(
                        "Selecione um usuário."
                    );

                    return;

                }


                try {

                    const textoUsuario =
                        select
                        .options[
                            select.selectedIndex
                        ]
                        .text;


                    const partes =
                        textoUsuario.split(
                            " - "
                        );


                    const nomeAtual =
                        partes[0] || "";


                    const emailAtual =
                        partes
                        .slice(1)
                        .join(" - ");


                    const novoNome =
                        prompt(
                            "Digite o novo nome:",
                            nomeAtual
                        );


                    if (
                        novoNome === null
                    ) {

                        return;

                    }


                    const novoEmail =
                        prompt(
                            "Digite o novo email:",
                            emailAtual
                        );


                    if (
                        novoEmail === null
                    ) {

                        return;

                    }


                    // SANITIZAÇÃO

                    const nome =
                        sanitizarTexto(
                            novoNome
                        );


                    const email =
                        novoEmail
                        .trim()
                        .toLowerCase();


                    // VALIDAÇÃO

                    if (!validarNome(nome)) {

                        alert(
                            "Nome inválido."
                        );

                        return;

                    }


                    if (!validarEmail(email)) {

                        alert(
                            "E-mail inválido."
                        );

                        return;

                    }


                    // WHERE

                    const existe =
                        await usuarioExistePorEmail(
                            email
                        );


                    if (
                        existe &&
                        email !==
                        emailAtual.toLowerCase()
                    ) {

                        alert(
                            "Já existe um usuário cadastrado com esse e-mail."
                        );

                        return;

                    }


                    // PERSISTÊNCIA / UPDATE

                    await setDoc(

                        doc(
                            db,
                            "usuarios",
                            uid
                        ),

                        {

                            nome: nome,

                            email: email

                        },

                        {

                            merge: true

                        }

                    );


                    alert(
                        "Usuário alterado com sucesso!"
                    );


                    carregarUsuarios();

                } catch (error) {

                    console.error(error);

                    alert(
                        "Erro ao alterar usuário: " +
                        error.message
                    );

                }

            }
        );


        // =========================
        // DELETE
        // DELETAR USUÁRIO
        // =========================

        document
        .getElementById("formDelete")
        .addEventListener(
            "submit",
            async (e) => {

                e.preventDefault();


                const select =
                    document
                    .getElementById(
                        "deleteUsuario"
                    );


                const uid =
                    select.value;


                if (!uid) {

                    alert(
                        "Selecione um usuário."
                    );

                    return;

                }


                const nome =
                    select
                    .options[
                        select.selectedIndex
                    ]
                    .text;


                const confirmar =
                    confirm(

                        "Tem certeza que deseja " +
                        "deletar:\n\n" +
                        nome +
                        "?"

                    );


                if (!confirmar) {

                    return;

                }


                try {

                    await deleteDoc(

                        doc(
                            db,
                            "usuarios",
                            uid
                        )

                    );


                    alert(
                        "Usuário deletado com sucesso!"
                    );


                    carregarUsuarios();


                } catch (error) {

                    console.error(error);


                    alert(
                        "Erro ao deletar usuário: " +
                        error.message
                    );

                }

            }
        );

    </script>

</body>

</html>
