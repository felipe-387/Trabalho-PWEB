<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro e Usuários</title>

    <link rel="stylesheet" href="estilo.css">

    <style>
        /* ==============================
           ÁREA DE USUÁRIOS
        ============================== */

        #usuariosContainer {
            margin-top: 20px;
        }

        #listaUsuarios {
            transition: filter 0.3s ease;
        }

        /* Usuários ficam borrados inicialmente */
        #listaUsuarios.borrado {
            filter: blur(7px);
            user-select: none;
            pointer-events: none;
        }

        .usuario-item {
            background-color: white;
            border: 1px solid #aaa;
            border-radius: 6px;
            padding: 12px;
            margin: 8px 0;
            text-align: left;
        }

        /* ==============================
           ADMIN
        ============================== */

        #areaDesbloqueio {
            margin-top: 25px;
        }

        #areaAdmin {
            display: none;
            margin-top: 25px;
        }

        #areaAdmin fieldset {
            border-color: #555;
        }

        #areaAdminLiberada {
            display: none;
        }

        #statusAdmin {
            font-weight: bold;
            margin: 10px 0;
        }

        .admin-liberado {
            color: green;
        }

        .admin-bloqueado {
            color: #cc0000;
        }

        #formDelete {
            margin-top: 20px;
        }

        #formDelete button {
            background-color: #cc0000;
        }

        #formDelete button:hover {
            background-color: #990000;
        }
    </style>

</head>

<body>


    <!-- ==========================================
         CADASTRO
    =========================================== -->

    <form id="formCadastro">

        <fieldset>

            <legend>
                CADASTRO
            </legend>

            <p>
                <label for="nome">
                    Nome:
                </label>

                <input
                    type="text"
                    id="nome"
                    minlength="2"
                    maxlength="80"
                    autocomplete="name"
                    required
                >
            </p>


            <p>
                <label for="email">
                    Email:
                </label>

                <input
                    type="email"
                    id="email"
                    maxlength="120"
                    autocomplete="email"
                    required
                >
            </p>


            <p>
                <label for="senha">
                    Senha:
                </label>

                <input
                    type="password"
                    id="senha"
                    minlength="6"
                    maxlength="128"
                    autocomplete="new-password"
                    required
                >
            </p>


            <p>
                <button type="submit">
                    CADASTRAR
                </button>

                <input
                    type="reset"
                    value="Limpar"
                >
            </p>

        </fieldset>

    </form>



    <!-- ==========================================
         LOGIN
    =========================================== -->

    <form id="formLogin">

        <fieldset>

            <legend>
                LOGIN
            </legend>

            <p>
                <label for="loginEmail">
                    Email:
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    maxlength="120"
                    autocomplete="email"
                    required
                >
            </p>


            <p>
                <label for="loginSenha">
                    Senha:
                </label>

                <input
                    type="password"
                    id="loginSenha"
                    minlength="6"
                    maxlength="128"
                    autocomplete="current-password"
                    required
                >
            </p>


            <p>
                <button type="submit">
                    FAZER LOGIN
                </button>
            </p>

        </fieldset>

    </form>



    <!-- ==========================================
         USUÁRIOS CADASTRADOS
    =========================================== -->

    <section id="usuariosContainer">

        <h2>
            USUÁRIOS CADASTRADOS
        </h2>


        <p id="mensagemUsuarios">
            Os usuários estão protegidos.
            Desbloqueie a área administrativa para visualizar.
        </p>


        <div
            id="listaUsuarios"
            class="borrado"
        >

            <!-- Os usuários serão colocados aqui pelo JavaScript -->

        </div>

    </section>



    <!-- ==========================================
         DESBLOQUEIO ADMINISTRATIVO
    =========================================== -->

    <section id="areaDesbloqueio">

        <form id="formDesbloquear">

            <fieldset>

                <legend>
                    🔒 ACESSO ADMINISTRATIVO
                </legend>


                <p>
                    Para visualizar e gerenciar
                    os usuários, entre com a
                    conta do administrador.
                </p>


                <p>
                    <label for="adminEmail">
                        Email do administrador:
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        maxlength="120"
                        autocomplete="off"
                        required
                    >
                </p>


                <p>
                    <label for="adminSenha">
                        Senha do administrador:
                    </label>

                    <input
                        type="password"
                        id="adminSenha"
                        minlength="6"
                        maxlength="128"
                        autocomplete="off"
                        required
                    >
                </p>


                <p>
                    <button type="submit">
                        DESBLOQUEAR
                    </button>
                </p>


                <p
                    id="statusAdmin"
                    class="admin-bloqueado"
                >
                    🔒 Área protegida
                </p>

            </fieldset>

        </form>

    </section>



    <!-- ==========================================
         ÁREA ADMINISTRATIVA LIBERADA
    =========================================== -->

    <section id="areaAdminLiberada">

        <form id="formAlterar">

            <fieldset>

                <legend>
                    ALTERAR USUÁRIO
                </legend>


                <p>
                    <label for="usuarios">
                        Usuário:
                    </label>

                    <select id="usuarios">

                        <option value="">
                            Selecione um usuário
                        </option>

                    </select>
                </p>


                <p>
                    <label for="novoNome">
                        Novo nome:
                    </label>

                    <input
                        type="text"
                        id="novoNome"
                        minlength="2"
                        maxlength="80"
                    >
                </p>


                <p>
                    <label for="novoEmail">
                        Novo email:
                    </label>

                    <input
                        type="email"
                        id="novoEmail"
                        maxlength="120"
                    >
                </p>


                <p>
                    <button type="submit">
                        ALTERAR
                    </button>
                </p>

            </fieldset>

        </form>



        <!-- ======================================
             DELETAR
        ======================================= -->

        <form id="formDelete">

            <fieldset>

                <legend>
                    DELETAR USUÁRIO
                </legend>


                <p>
                    <button type="submit">
                        DELETAR
                    </button>
                </p>

            </fieldset>

        </form>

    </section>



    <!-- ==========================================
         FIREBASE
    =========================================== -->

    <script type="module">

        import {
            initializeApp
        } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword
        } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            setDoc,
            deleteDoc,
            query,
            where
        } from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



        // ==========================================
        // CONFIGURAÇÃO DO FIREBASE
        // ==========================================
        // COLOQUE AQUI A MESMA CONFIGURAÇÃO
        // DO SEU PROJETO ATUAL.
        // ==========================================

        const firebaseConfig = {

            apiKey: "SUA_API_KEY",

            authDomain:
                "albano-2e9e7.firebaseapp.com",

            projectId:
                "albano-2e9e7",

            storageBucket:
                "albano-2e9e7.firebasestorage.app",

            messagingSenderId:
                "SEU_MESSAGING_SENDER_ID",

            appId:
                "SEU_APP_ID"

        };


        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        const db =
            getFirestore(app);



        // ==========================================
        // UID DO ADMIN
        // ==========================================
        // COLOQUE O UID DA CONTA ADMIN AQUI.
        // ==========================================

        const ADMIN_UID =
            "COLOQUE_SEU_UID_AQUI";



        // ==========================================
        // ELEMENTOS
        // ==========================================

        const formCadastro =
            document.getElementById(
                "formCadastro"
            );


        const formLogin =
            document.getElementById(
                "formLogin"
            );


        const formDesbloquear =
            document.getElementById(
                "formDesbloquear"
            );


        const listaUsuarios =
            document.getElementById(
                "listaUsuarios"
            );


        const mensagemUsuarios =
            document.getElementById(
                "mensagemUsuarios"
            );


        const statusAdmin =
            document.getElementById(
                "statusAdmin"
            );


        const areaAdminLiberada =
            document.getElementById(
                "areaAdminLiberada"
            );


        const selectUsuarios =
            document.getElementById(
                "usuarios"
            );


        const formAlterar =
            document.getElementById(
                "formAlterar"
            );


        const formDelete =
            document.getElementById(
                "formDelete"
            );



        // ==========================================
        // SANITIZAÇÃO
        // ==========================================

        function sanitizarTexto(valor) {

            return valor
                .trim()
                .replace(/\s+/g, " ");

        }



        // ==========================================
        // VALIDAÇÃO NOME
        // ==========================================

        function validarNome(nome) {

            return (
                nome.length >= 2 &&
                nome.length <= 80 &&
                !nome.includes("<") &&
                !nome.includes(">")
            );

        }



        // ==========================================
        // VALIDAÇÃO EMAIL
        // ==========================================

        function validarEmail(email) {

            const regex =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            return (
                email.length <= 120 &&
                regex.test(email)
            );

        }



        // ==========================================
        // VALIDAÇÃO SENHA
        // ==========================================

        function validarSenha(senha) {

            return (
                senha.length >= 6 &&
                senha.length <= 128
            );

        }



        // ==========================================
        // CADASTRO
        // ==========================================

        formCadastro.addEventListener(
            "submit",
            async (evento) => {

                evento.preventDefault();


                const nome =
                    sanitizarTexto(
                        document.getElementById(
                            "nome"
                        ).value
                    );


                const email =
                    sanitizarTexto(
                        document.getElementById(
                            "email"
                        ).value
                    ).toLowerCase();


                const senha =
                    document.getElementById(
                        "senha"
                    ).value;



                if (!validarNome(nome)) {

                    alert(
                        "Nome inválido."
                    );

                    return;

                }


                if (!validarEmail(email)) {

                    alert(
                        "Email inválido."
                    );

                    return;

                }


                if (!validarSenha(senha)) {

                    alert(
                        "A senha deve ter entre 6 e 128 caracteres."
                    );

                    return;

                }



                try {

                    const credencial =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            senha
                        );


                    const user =
                        credencial.user;


                    await setDoc(
                        doc(
                            db,
                            "usuarios",
                            user.uid
                        ),
                        {
                            nome: nome,
                            email: email
                        }
                    );


                    alert(
                        "Cadastro realizado com sucesso!"
                    );


                    formCadastro.reset();


                    // Atualiza a lista se estiver
                    // desbloqueada

                    await carregarUsuarios();


                } catch (erro) {

                    console.error(
                        "ERRO NO CADASTRO:",
                        erro
                    );


                    alert(
                        "Erro no cadastro:\n\n" +
                        erro.code +
                        "\n" +
                        erro.message
                    );

                }

            }
        );



        // ==========================================
        // LOGIN NORMAL
        // ==========================================

        formLogin.addEventListener(
            "submit",
            async (evento) => {

                evento.preventDefault();


                const email =
                    sanitizarTexto(
                        document.getElementById(
                            "loginEmail"
                        ).value
                    ).toLowerCase();


                const senha =
                    document.getElementById(
                        "loginSenha"
                    ).value;



                try {

                    const credencial =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            senha
                        );


                    const user =
                        credencial.user;


                    // Admin também pode usar
                    // o login normal.

                    if (
                        user.uid === ADMIN_UID
                    ) {

                        alert(
                            "Login de administrador realizado."
                        );

                        desbloquearAreaAdmin();

                        return;

                    }


                    window.location.href =
                        "site.html";


                } catch (erro) {

                    console.error(
                        "ERRO NO LOGIN:",
                        erro
                    );


                    alert(
                        "E-mail ou senha incorretos."
                    );

                }

            }
        );



        // ==========================================
        // DESBLOQUEAR ÁREA ADMIN
        // ==========================================

        formDesbloquear.addEventListener(
            "submit",
            async (evento) => {

                evento.preventDefault();


                const email =
                    sanitizarTexto(
                        document.getElementById(
                            "adminEmail"
                        ).value
                    ).toLowerCase();


                const senha =
                    document.getElementById(
                        "adminSenha"
                    ).value;



                if (!validarEmail(email)) {

                    alert(
                        "Digite um email válido."
                    );

                    return;

                }


                if (!validarSenha(senha)) {

                    alert(
                        "Senha inválida."
                    );

                    return;

                }



                try {

                    // ==================================
                    // LOGIN DA CONTA ADMIN
                    // ==================================

                    const credencial =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            senha
                        );


                    const user =
                        credencial.user;



                    // ==================================
                    // CONFERE O UID
                    // ==================================

                    if (
                        user.uid !== ADMIN_UID
                    ) {

                        alert(
                            "Esta conta não possui permissão de administrador."
                        );


                        statusAdmin.textContent =
                            "🔒 Acesso negado";


                        statusAdmin.className =
                            "admin-bloqueado";


                        return;

                    }



                    // ==================================
                    // LIBERA
                    // ==================================

                    desbloquearAreaAdmin();


                    formDesbloquear.reset();


                } catch (erro) {

                    console.error(
                        "ERRO ADMIN:",
                        erro
                    );


                    statusAdmin.textContent =
                        "🔒 Credenciais inválidas";


                    statusAdmin.className =
                        "admin-bloqueado";


                    alert(
                        "Conta de administrador inválida."
                    );

                }

            }
        );



        // ==========================================
        // FUNÇÃO DE DESBLOQUEIO
        // ==========================================

        async function desbloquearAreaAdmin() {

            listaUsuarios.classList.remove(
                "borrado"
            );


            mensagemUsuarios.textContent =
                "Usuários cadastrados:";


            statusAdmin.textContent =
                "🔓 Área administrativa desbloqueada";


            statusAdmin.className =
                "admin-liberado";


            areaAdminLiberada.style.display =
                "block";


            await carregarUsuarios();

        }



        // ==========================================
        // CARREGAR USUÁRIOS
        // ==========================================

        async function carregarUsuarios() {

            try {

                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "usuarios"
                        )
                    );


                listaUsuarios.innerHTML =
                    "";


                selectUsuarios.innerHTML =
                    "";


                const opcao =
                    document.createElement(
                        "option"
                    );


                opcao.value = "";


                opcao.textContent =
                    "Selecione um usuário";


                selectUsuarios.appendChild(
                    opcao
                );



                snapshot.forEach(
                    (documento) => {

                        const dados =
                            documento.data();



                        // ==================================
                        // LISTA VISUAL
                        // ==================================

                        const div =
                            document.createElement(
                                "div"
                            );


                        div.className =
                            "usuario-item";


                        // textContent protege contra XSS

                        div.textContent =
                            `${dados.nome || "Sem nome"} - ${dados.email || "Sem email"}`;


                        listaUsuarios.appendChild(
                            div
                        );



                        // ==================================
                        // SELECT DO ADMIN
                        // ==================================

                        const option =
                            document.createElement(
                                "option"
                            );


                        option.value =
                            documento.id;


                        option.textContent =
                            `${dados.nome || "Sem nome"} - ${dados.email || "Sem email"}`;


                        selectUsuarios.appendChild(
                            option
                        );

                    }
                );


            } catch (erro) {

                console.error(
                    "ERRO AO CARREGAR USUÁRIOS:",
                    erro
                );


                alert(
                    "Erro ao carregar usuários:\n\n" +
                    erro.code +
                    "\n" +
                    erro.message
                );

            }

        }



        // ==========================================
        // ALTERAR
        // ==========================================

        formAlterar.addEventListener(
            "submit",
            async (evento) => {

                evento.preventDefault();


                // ==================================
                // CONFERE ADMIN
                // ==================================

                if (
                    !auth.currentUser ||
                    auth.currentUser.uid !== ADMIN_UID
                ) {

                    alert(
                        "Acesso negado."
                    );

                    return;

                }



                const uid =
                    selectUsuarios.value;


                if (!uid) {

                    alert(
                        "Selecione um usuário."
                    );

                    return;

                }



                const novoNome =
                    sanitizarTexto(
                        document.getElementById(
                            "novoNome"
                        ).value
                    );


                const novoEmail =
                    sanitizarTexto(
                        document.getElementById(
                            "novoEmail"
                        ).value
                    ).toLowerCase();



                if (!validarNome(novoNome)) {

                    alert(
                        "Nome inválido."
                    );

                    return;

                }


                if (!validarEmail(novoEmail)) {

                    alert(
                        "Email inválido."
                    );

                    return;

                }



                try {

                    // ==================================
                    // WHERE
                    // ==================================

                    const consulta =
                        query(
                            collection(
                                db,
                                "usuarios"
                            ),
                            where(
                                "email",
                                "==",
                                novoEmail
                            )
                        );


                    const resultado =
                        await getDocs(
                            consulta
                        );


                    let duplicado =
                        false;


                    resultado.forEach(
                        (documento) => {

                            if (
                                documento.id !== uid
                            ) {

                                duplicado =
                                    true;

                            }

                        }
                    );


                    if (duplicado) {

                        alert(
                            "Esse email já pertence a outro usuário."
                        );

                        return;

                    }



                    // ==================================
                    // ATUALIZA
                    // ==================================

                    await setDoc(
                        doc(
                            db,
                            "usuarios",
                            uid
                        ),
                        {
                            nome: novoNome,
                            email: novoEmail
                        },
                        {
                            merge: true
                        }
                    );


                    alert(
                        "Usuário alterado com sucesso!"
                    );


                    formAlterar.reset();


                    await carregarUsuarios();

                } catch (erro) {

                    console.error(
                        "ERRO AO ALTERAR:",
                        erro
                    );


                    alert(
                        "Erro ao alterar usuário:\n\n" +
                        erro.code +
                        "\n" +
                        erro.message
                    );

                }

            }
        );



        // ==========================================
        // DELETAR
        // ==========================================

        formDelete.addEventListener(
            "submit",
            async (evento) => {

                evento.preventDefault();


                // ==================================
                // CONFERE ADMIN
                // ==================================

                if (
                    !auth.currentUser ||
                    auth.currentUser.uid !== ADMIN_UID
                ) {

                    alert(
                        "Acesso negado."
                    );

                    return;

                }



                const uid =
                    selectUsuarios.value;


                if (!uid) {

                    alert(
                        "Selecione um usuário."
                    );

                    return;

                }



                // ==================================
                // NÃO DEIXA ADMIN SE APAGAR
                // ==================================

                if (
                    uid === ADMIN_UID
                ) {

                    alert(
                        "O administrador não pode excluir a própria conta."
                    );

                    return;

                }



                const confirmar =
                    confirm(
                        "Tem certeza que deseja deletar este usuário?"
                    );


                if (!confirmar) {

                    return;

                }



                try {

                    await deleteDoc(
                        doc(
                            db,
                            "usuarios",
                            uid
                        )
                    );


                    alert(
                        "Usuário deletado com sucesso!"
                    );


                    await carregarUsuarios();


                } catch (erro) {

                    console.error(
                        "ERRO AO DELETAR:",
                        erro
                    );


                    alert(
                        "Erro ao deletar usuário:\n\n" +
                        erro.code +
                        "\n" +
                        erro.message
                    );

                }

            }
        );

    </script>

</body>

</html>
