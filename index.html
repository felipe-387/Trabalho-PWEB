```html
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="utf-8">

    <link rel="stylesheet" href="estilo.css">

    <title>PÁGINA DE LOGIN</title>

</head>

<body>


    <!-- LOGIN -->

    <form id="formLogin">

        <fieldset id="fie">

            <legend>LOGIN</legend>

            <p>
                <label>Login (Email):</label>

                <input
                    type="email"
                    id="loginEmail"
                    required
                >
            </p>

            <p>
                <label>SENHA:</label>

                <input
                    type="password"
                    id="loginSenha"
                    required
                >
            </p>

            <center>

                <button type="submit">
                    FAZER LOGIN
                </button>

            </center>

        </fieldset>

    </form>


    <!-- CADASTRO -->

    <form id="formCadastro">

        <fieldset id="cad">

            <legend>
                CASO NÃO TENHA LOGIN, CADASTRE-SE
            </legend>

            <p>
                <label>Nome:</label>

                <input
                    type="text"
                    id="cadastroNome"
                    required
                >
            </p>

            <p>
                <label>Email:</label>

                <input
                    type="email"
                    id="cadastroEmail"
                    required
                >
            </p>

            <p>
                <label>Senha:</label>

                <input
                    type="password"
                    id="cadastroSenha"
                    required
                >
            </p>

            <center>

                <button type="submit">
                    CADASTRE-SE
                </button>

                <input
                    type="reset"
                    value="Limpar"
                >

            </center>

        </fieldset>

    </form>


    <!-- ADMINISTRADOR -->

    <form id="formDelete">

        <fieldset id="delete">

            <legend>
                ADMINISTRADOR - DELETAR REGISTRO
            </legend>

            <p>
                <label>Escolha o usuário:</label>

                <select
                    id="deleteUsuario"
                    required
                >

                    <option value="">
                        Carregando usuários...
                    </option>

                </select>

            </p>

            <center>

                <button type="submit">
                    DELETAR REGISTRO
                </button>

            </center>

        </fieldset>

    </form>


    <script type="module">


        // =========================
        // IMPORTAÇÕES FIREBASE
        // =========================

        import { initializeApp }

        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


        import {

            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword

        }

        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        import {

            getFirestore,
            doc,
            setDoc,
            deleteDoc,
            collection,
            getDocs

        }

        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        // =========================
        // CONFIGURAÇÃO FIREBASE
        // =========================

        const firebaseConfig = {

            apiKey: "AIzaSyDTbM_zYLwr48RRTc-Vg075ftqJ5NfwOWQ",

            authDomain: "albano-2e9e7.firebaseapp.com",

            projectId: "albano-2e9e7",

            storageBucket: "albano-2e9e7.firebasestorage.app",

            messagingSenderId: "978832727853",

            appId: "1:978832727853:web:57663dfe584550eb06fda4"

        };


        // =========================
        // INICIALIZAÇÃO
        // =========================

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);


        // =========================
        // CADASTRO
        // =========================

        document
        .getElementById("formCadastro")
        .addEventListener("submit", async (e) => {

            e.preventDefault();


            const nome =
                document
                .getElementById("cadastroNome")
                .value
                .trim();


            const email =
                document
                .getElementById("cadastroEmail")
                .value
                .trim();


            const senha =
                document
                .getElementById("cadastroSenha")
                .value;


            try {

                const userCredential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        senha
                    );


                const user = userCredential.user;


                // SALVA OS DADOS NO FIRESTORE

                await setDoc(

                    doc(
                        db,
                        "usuarios",
                        user.uid
                    ),

                    {

                        nome: nome,

                        email: email

                    }

                );


                alert(
                    "Usuário cadastrado com sucesso!"
                );


                document
                    .getElementById("formCadastro")
                    .reset();


                // ATUALIZA A LISTA DE USUÁRIOS

                carregarUsuarios();


            } catch (error) {

                alert(error.message);

            }

        });


        // =========================
        // LOGIN
        // =========================

        document
        .getElementById("formLogin")
        .addEventListener("submit", async (e) => {

            e.preventDefault();


            const email =
                document
                .getElementById("loginEmail")
                .value
                .trim();


            const senha =
                document
                .getElementById("loginSenha")
                .value;


            try {

                await signInWithEmailAndPassword(

                    auth,
                    email,
                    senha

                );


                window.location.href =
                    "site.html";


            } catch (error) {

                alert(error.message);

            }

        });


        // =========================
        // CARREGAR USUÁRIOS
        // =========================

        async function carregarUsuarios() {

            const select =
                document
                .getElementById("deleteUsuario");


            try {

                const usuariosRef =
                    collection(
                        db,
                        "usuarios"
                    );


                const resultado =
                    await getDocs(
                        usuariosRef
                    );


                // LIMPA A LISTA

                select.innerHTML = "";


                // CASO NÃO TENHA USUÁRIOS

                if (resultado.empty) {

                    const opcao =
                        document.createElement(
                            "option"
                        );


                    opcao.value = "";

                    opcao.textContent =
                        "Nenhum usuário cadastrado";


                    select.appendChild(
                        opcao
                    );


                    return;

                }


                // ADICIONA OS USUÁRIOS

                resultado.forEach(
                    (usuario) => {

                        const dados =
                            usuario.data();


                        const opcao =
                            document.createElement(
                                "option"
                            );


                        // GUARDA O UID

                        opcao.value =
                            usuario.id;


                        // MOSTRA NOME E EMAIL

                        opcao.textContent =
                            dados.nome +
                            " - " +
                            dados.email;


                        select.appendChild(
                            opcao
                        );

                    }
                );


            } catch (error) {

                console.error(error);


                select.innerHTML =
                    "<option>" +
                    "Erro ao carregar usuários" +
                    "</option>";

            }

        }


        // CARREGAR USUÁRIOS AO ABRIR

        carregarUsuarios();


        // =========================
        // DELETAR USUÁRIO
        // =========================

        document
        .getElementById("formDelete")
        .addEventListener("submit", async (e) => {

            e.preventDefault();


            const select =
                document
                .getElementById(
                    "deleteUsuario"
                );


            const uid =
                select.value;


            if (!uid) {

                alert(
                    "Selecione um usuário."
                );

                return;

            }


            const nome =
                select.options[
                    select.selectedIndex
                ].text;


            const confirmar =
                confirm(

                    "Tem certeza que deseja " +
                    "deletar:\n\n" +
                    nome +
                    "?"

                );


            if (!confirmar) {

                return;

            }


            try {

                // DELETA SOMENTE O USUÁRIO SELECIONADO

                await deleteDoc(

                    doc(
                        db,
                        "usuarios",
                        uid
                    )

                );


                alert(
                    "Usuário deletado com sucesso!"
                );


                // ATUALIZA A LISTA

                carregarUsuarios();


            } catch (error) {

                console.error(error);


                alert(
                    "Erro ao deletar usuário: " +
                    error.message
                );

            }

        });

    </script>

</body>

</html>
```
