<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PÁGINA DE LOGIN</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <!-- ==============================
         LOGIN
    =============================== -->

    <form id="formLogin">

        <fieldset>

            <legend>LOGIN</legend>

            <p>
                <label for="loginEmail">
                    Login (Email):
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    name="loginEmail"
                    maxlength="120"
                    autocomplete="email"
                    required
                >
            </p>

            <p>
                <label for="loginSenha">
                    SENHA:
                </label>

                <input
                    type="password"
                    id="loginSenha"
                    name="loginSenha"
                    minlength="6"
                    maxlength="128"
                    autocomplete="current-password"
                    required
                >
            </p>

            <p>
                <button type="submit">
                    FAZER LOGIN
                </button>
            </p>

        </fieldset>

    </form>


    <!-- ==============================
         CADASTRO
    =============================== -->

    <form id="formCadastro">

        <fieldset>

            <legend>
                CASO NÃO TENHA LOGIN,<br>
                CADASTRE-SE
            </legend>

            <p>
                <label for="nome">
                    Nome:
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    minlength="2"
                    maxlength="80"
                    autocomplete="name"
                    required
                >
            </p>

            <p>
                <label for="email">
                    Email:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="120"
                    autocomplete="email"
                    required
                >
            </p>

            <p>
                <label for="senha">
                    Senha:
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    minlength="6"
                    maxlength="128"
                    autocomplete="new-password"
                    required
                >
            </p>

            <p>
                <button type="submit">
                    CADASTRE-SE
                </button>

                <input
                    type="reset"
                    value="Limpar"
                >
            </p>

        </fieldset>

    </form>


    <!-- ==============================
         ÁREA ADMINISTRATIVA
         Fica escondida até o ADMIN
         realizar login.
    =============================== -->

    <div
        id="areaAdmin"
        style="display: none;"
    >

        <form id="formAdmin">

            <fieldset>

                <legend>
                    ÁREA ADMINISTRATIVA
                </legend>

                <p>
                    <strong>
                        GERENCIAR CONTAS CADASTRADAS
                    </strong>
                </p>

                <p>
                    <label for="usuarios">
                        Selecione uma conta:
                    </label>

                    <select
                        id="usuarios"
                        required
                    >

                        <option value="">
                            Selecione um usuário
                        </option>

                    </select>
                </p>

            </fieldset>

        </form>


        <!-- ==============================
             ALTERAR USUÁRIO
        =============================== -->

        <form id="formAlterar">

            <fieldset>

                <legend>
                    ALTERAR USUÁRIO
                </legend>

                <p>
                    <label for="novoNome">
                        Novo nome:
                    </label>

                    <input
                        type="text"
                        id="novoNome"
                        minlength="2"
                        maxlength="80"
                    >
                </p>

                <p>
                    <label for="novoEmail">
                        Novo e-mail:
                    </label>

                    <input
                        type="email"
                        id="novoEmail"
                        maxlength="120"
                    >
                </p>

                <p>
                    <button type="submit">
                        ALTERAR
                    </button>
                </p>

            </fieldset>

        </form>


        <!-- ==============================
             DELETAR USUÁRIO
        =============================== -->

        <form id="formDelete">

            <fieldset>

                <legend>
                    DELETAR USUÁRIO
                </legend>

                <p>
                    <button type="submit">
                        DELETAR
                    </button>
                </p>

            </fieldset>

        </form>

    </div>


    <!-- ==============================
         FIREBASE
    =============================== -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        import {
            getFirestore,
            collection,
            getDocs,
            doc,
            setDoc,
            deleteDoc,
            query,
            where
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        // ==================================================
        // CONFIGURAÇÃO DO FIREBASE
        // ==================================================
        // MANTENHA A MESMA CONFIGURAÇÃO QUE JÁ ESTAVA
        // FUNCIONANDO NO SEU INDEX.HTML.
        // ==================================================

        const firebaseConfig = {

            apiKey: "SUA_API_KEY",

            authDomain:
                "albano-2e9e7.firebaseapp.com",

            projectId:
                "albano-2e9e7",

            storageBucket:
                "albano-2e9e7.firebasestorage.app",

            messagingSenderId:
                "SEU_MESSAGING_SENDER_ID",

            appId:
                "SEU_APP_ID"

        };


        const app =
            initializeApp(firebaseConfig);


        const auth =
            getAuth(app);


        const db =
            getFirestore(app);


        // ==================================================
        // UID DO ADMINISTRADOR
        // ==================================================
        // COLOQUE AQUI O UID DA CONTA ADMINISTRADORA.
        // ==================================================

        const ADMIN_UID =
            "COLOQUE_SEU_UID_AQUI";


        // ==================================================
        // ELEMENTOS
        // ==================================================

        const formLogin =
            document.getElementById("formLogin");


        const formCadastro =
            document.getElementById("formCadastro");


        const areaAdmin =
            document.getElementById("areaAdmin");


        const selectUsuarios =
            document.getElementById("usuarios");


        const formAlterar =
            document.getElementById("formAlterar");


        const formDelete =
            document.getElementById("formDelete");


        // ==================================================
        // SANITIZAÇÃO
        // ==================================================

        function sanitizarTexto(valor) {

            return valor
                .trim()
                .replace(/\s+/g, " ");

        }


        // ==================================================
        // VALIDAÇÃO DO NOME
        // ==================================================

        function validarNome(nome) {

            return (
                nome.length >= 2 &&
                nome.length <= 80 &&
                !nome.includes("<") &&
                !nome.includes(">")
            );

        }


        // ==================================================
        // VALIDAÇÃO DO EMAIL
        // ==================================================

        function validarEmail(email) {

            const regex =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            return (
                email.length <= 120 &&
                regex.test(email)
            );

        }


        // ==================================================
        // VALIDAÇÃO DA SENHA
        // ==================================================

        function validarSenha(senha) {

            return (
                senha.length >= 6 &&
                senha.length <= 128
            );

        }


        // ==================================================
        // VERIFICAR SE É ADMIN
        // ==================================================

        function usuarioEhAdmin(user) {

            return (
                user &&
                user.uid === ADMIN_UID
            );

        }


        // ==================================================
        // VERIFICAR LOGIN ATUAL
        // ==================================================

        onAuthStateChanged(auth, async (user) => {

            if (!user) {

                areaAdmin.style.display = "none";

                return;
            }


            // ==============================================
            // ADMIN
            // ==============================================

            if (usuarioEhAdmin(user)) {

                areaAdmin.style.display = "block";

                await carregarUsuarios();

            }

            // ==============================================
            // USUÁRIO NORMAL
            // ==============================================

            else {

                areaAdmin.style.display = "none";

            }

        });


        // ==================================================
        // CADASTRO
        // ==================================================

        formCadastro.addEventListener(
            "submit",
            async (evento) => {

                evento.preventDefault();


                let nome =
                    sanitizarTexto(
                        document.getElementById("nome").value
                    );


                let email =
                    sanitizarTexto(
                        document.getElementById("email").value
                    ).toLowerCase();


                const senha =
                    document.getElementById("senha").value;


                // ==========================================
                // VALIDAÇÕES
                // ==========================================

                if (!validarNome(nome)) {

                    alert(
                        "Nome inválido.\n\n" +
                        "O nome deve possuir entre 2 e 80 caracteres."
                    );

                    return;

                }


                if (!validarEmail(email)) {

                    alert(
                        "Digite um e-mail válido."
                    );

                    return;

                }


                if (!validarSenha(senha)) {

                    alert(
                        "A senha deve possuir entre 6 e 128 caracteres."
                    );

                    return;

                }


                try {

                    // ======================================
                    // CRIA USUÁRIO NO FIREBASE AUTH
                    // ======================================

                    const credencial =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            senha
                        );


                    const user =
                        credencial.user;


                    // ======================================
                    // SALVA DADOS NO FIRESTORE
                    // ======================================

                    await setDoc(
                        doc(
                            db,
                            "usuarios",
                            user.uid
                        ),
                        {
                            nome: nome,
                            email: email
                        }
                    );


                    alert(
                        "Cadastro realizado com sucesso!"
                    );


                    formCadastro.reset();


                } catch (erro) {

                    console.error(
                        "ERRO NO CADASTRO:",
                        erro
                    );


                    if (
                        erro.code ===
                        "auth/email-already-in-use"
                    ) {

                        alert(
                            "Esse e-mail já está cadastrado."
                        );

                    }

                    else if (
                        erro.code ===
                        "auth/invalid-email"
                    ) {

                        alert(
                            "O e-mail informado é inválido."
                        );

                    }

                    else if (
                        erro.code ===
                        "auth/weak-password"
                    ) {

                        alert(
                            "A senha é muito fraca."
                        );

                    }

                    else {

                        alert(
                            "Não foi possível realizar o cadastro.\n\n" +
                            erro.code +
                            "\n" +
                            erro.message
                        );

                    }

                }

            }
        );


        // ==================================================
        // LOGIN
        // ==================================================

        formLogin.addEventListener(
            "submit",
            async (evento) => {

                evento.preventDefault();


                const email =
                    sanitizarTexto(
                        document.getElementById("loginEmail").value
                    ).toLowerCase();


                const senha =
                    document.getElementById("loginSenha").value;


                if (!validarEmail(email)) {

                    alert(
                        "Digite um e-mail válido."
                    );

                    return;

                }


                if (!validarSenha(senha)) {

                    alert(
                        "Senha inválida."
                    );

                    return;

                }


                try {

                    const credencial =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            senha
                        );


                    const user =
                        credencial.user;


                    // ======================================
                    // SE FOR ADMIN
                    // ======================================

                    if (usuarioEhAdmin(user)) {

                        areaAdmin.style.display =
                            "block";


                        await carregarUsuarios();


                        alert(
                            "Login de administrador realizado!"
                        );

                        return;

                    }


                    // ======================================
                    // USUÁRIO NORMAL
                    // ======================================

                    window.location.href =
                        "site.html";


                } catch (erro) {

                    console.error(
                        "ERRO NO LOGIN:",
                        erro
                    );


                    if (
                        erro.code ===
                        "auth/invalid-credential"
                    ) {

                        alert(
                            "E-mail ou senha incorretos."
                        );

                    }

                    else if (
                        erro.code ===
                        "auth/user-not-found"
                    ) {

                        alert(
                            "Usuário não encontrado."
                        );

                    }

                    else if (
                        erro.code ===
                        "auth/wrong-password"
                    ) {

                        alert(
                            "Senha incorreta."
                        );

                    }

                    else {

                        alert(
                            "Não foi possível realizar o login.\n\n" +
                            erro.code +
                            "\n" +
                            erro.message
                        );

                    }

                }

            }
        );


        // ==================================================
        // CARREGAR USUÁRIOS
        // ==================================================

        async function carregarUsuarios() {

            // ==============================================
            // SEGURANÇA
            // ==============================================

            if (!auth.currentUser) {

                return;

            }


            if (!usuarioEhAdmin(auth.currentUser)) {

                return;

            }


            try {

                const snapshot =
                    await getDocs(
                        collection(
                            db,
                            "usuarios"
                        )
                    );


                // Limpa a lista

                selectUsuarios.innerHTML = "";


                // Opção inicial

                const opcaoInicial =
                    document.createElement("option");


                opcaoInicial.value = "";

                opcaoInicial.textContent =
                    "Selecione um usuário";


                selectUsuarios.appendChild(
                    opcaoInicial
                );


                // ==========================================
                // ADICIONA USUÁRIOS
                // ==========================================

                snapshot.forEach(
                    (documento) => {

                        const dados =
                            documento.data();


                        const option =
                            document.createElement("option");


                        option.value =
                            documento.id;


                        // textContent evita XSS

                        option.textContent =
                            `${dados.nome || "Sem nome"} - ${dados.email || "Sem e-mail"}`;


                        selectUsuarios.appendChild(
                            option
                        );

                    }
                );


            } catch (erro) {

                console.error(
                    "ERRO AO CARREGAR USUÁRIOS:",
                    erro
                );


                alert(
                    "Não foi possível carregar os usuários.\n\n" +
                    erro.code +
                    "\n" +
                    erro.message
                );

            }

        }


        // ==================================================
        // ALTERAR USUÁRIO
        // ==================================================

        formAlterar.addEventListener(
            "submit",
            async (evento) => {

                evento.preventDefault();


                // ==========================================
                // VERIFICAÇÃO DO ADMIN
                // ==========================================

                if (
                    !auth.currentUser ||
                    !usuarioEhAdmin(auth.currentUser)
                ) {

                    alert(
                        "Acesso negado."
                    );

                    return;

                }


                const uid =
                    selectUsuarios.value;


                if (!uid) {

                    alert(
                        "Selecione um usuário."
                    );

                    return;

                }


                let novoNome =
                    sanitizarTexto(
                        document.getElementById(
                            "novoNome"
                        ).value
                    );


                let novoEmail =
                    sanitizarTexto(
                        document.getElementById(
                            "novoEmail"
                        ).value
                    ).toLowerCase();


                // ==========================================
                // VALIDAÇÕES
                // ==========================================

                if (!validarNome(novoNome)) {

                    alert(
                        "Nome inválido.\n\n" +
                        "Use entre 2 e 80 caracteres."
                    );

                    return;

                }


                if (!validarEmail(novoEmail)) {

                    alert(
                        "Digite um e-mail válido."
                    );

                    return;

                }


                try {

                    // ======================================
                    // CONSULTA COM WHERE
                    // ======================================
                    // Verifica se outro usuário já possui
                    // esse e-mail.
                    // ======================================

                    const consulta =
                        query(
                            collection(
                                db,
                                "usuarios"
                            ),
                            where(
                                "email",
                                "==",
                                novoEmail
                            )
                        );


                    const resultado =
                        await getDocs(
                            consulta
                        );


                    let emailDuplicado =
                        false;


                    resultado.forEach(
                        (documento) => {

                            if (
                                documento.id !== uid
                            ) {

                                emailDuplicado =
                                    true;

                            }

                        }
                    );


                    if (emailDuplicado) {

                        alert(
                            "Esse e-mail já pertence a outro usuário."
                        );

                        return;

                    }


                    // ======================================
                    // ATUALIZA FIRESTORE
                    // ======================================

                    await setDoc(
                        doc(
                            db,
                            "usuarios",
                            uid
                        ),
                        {
                            nome: novoNome,
                            email: novoEmail
                        },
                        {
                            merge: true
                        }
                    );


                    alert(
                        "Usuário alterado com sucesso!"
                    );


                    formAlterar.reset();


                    await carregarUsuarios();


                } catch (erro) {

                    console.error(
                        "ERRO AO ALTERAR:",
                        erro
                    );


                    alert(
                        "Não foi possível alterar o usuário.\n\n" +
                        erro.code +
                        "\n" +
                        erro.message
                    );

                }

            }
        );


        // ==================================================
        // DELETAR USUÁRIO
        // ==================================================

        formDelete.addEventListener(
            "submit",
            async (evento) => {

                evento.preventDefault();


                // ==========================================
                // VERIFICAÇÃO DO ADMIN
                // ==========================================

                if (
                    !auth.currentUser ||
                    !usuarioEhAdmin(auth.currentUser)
                ) {

                    alert(
                        "Acesso negado."
                    );

                    return;

                }


                const uid =
                    selectUsuarios.value;


                if (!uid) {

                    alert(
                        "Selecione um usuário."
                    );

                    return;

                }


                // ==========================================
                // IMPEDE ADMIN DE SE APAGAR
                // ==========================================

                if (uid === ADMIN_UID) {

                    alert(
                        "O administrador não pode excluir a própria conta."
                    );

                    return;

                }


                const confirmar =
                    confirm(
                        "Tem certeza que deseja deletar esta conta?"
                    );


                if (!confirmar) {

                    return;

                }


                try {

                    // ======================================
                    // DELETE FIRESTORE
                    // ======================================

                    await deleteDoc(
                        doc(
                            db,
                            "usuarios",
                            uid
                        )
                    );


                    alert(
                        "Usuário deletado com sucesso!"
                    );


                    await carregarUsuarios();


                } catch (erro) {

                    console.error(
                        "ERRO AO DELETAR:",
                        erro
                    );


                    alert(
                        "Não foi possível deletar o usuário.\n\n" +
                        erro.code +
                        "\n" +
                        erro.message
                    );

                }

            }
        );

    </script>

</body>

</html>
