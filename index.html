<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="estilo.css">

    <title>PÁGINA DE LOGIN</title>
</head>

<body>

    <!-- =========================
         LOGIN
    ========================== -->

    <form id="formLogin">

        <fieldset id="fie">

            <legend>LOGIN</legend>

            <p>
                <label for="loginEmail">Login (Email):</label>

                <input
                    type="email"
                    id="loginEmail"
                    maxlength="120"
                    autocomplete="email"
                    required
                >
            </p>

            <p>
                <label for="loginSenha">SENHA:</label>

                <input
                    type="password"
                    id="loginSenha"
                    minlength="6"
                    maxlength="128"
                    autocomplete="current-password"
                    required
                >
            </p>

            <center>

                <button type="submit">
                    FAZER LOGIN
                </button>

            </center>

        </fieldset>

    </form>


    <!-- =========================
         CADASTRO
    ========================== -->

    <form id="formCadastro">

        <fieldset id="cad">

            <legend>
                CASO NÃO TENHA LOGIN, CADASTRE-SE
            </legend>

            <p>

                <label for="cadastroNome">
                    Nome:
                </label>

                <input
                    type="text"
                    id="cadastroNome"
                    minlength="2"
                    maxlength="80"
                    autocomplete="name"
                    required
                >

            </p>

            <p>

                <label for="cadastroEmail">
                    Email:
                </label>

                <input
                    type="email"
                    id="cadastroEmail"
                    maxlength="120"
                    autocomplete="email"
                    required
                >

            </p>

            <p>

                <label for="cadastroSenha">
                    Senha:
                </label>

                <input
                    type="password"
                    id="cadastroSenha"
                    minlength="6"
                    maxlength="128"
                    autocomplete="new-password"
                    required
                >

            </p>

            <center>

                <button type="submit">
                    CADASTRE-SE
                </button>

                <input
                    type="reset"
                    value="Limpar"
                >

            </center>

        </fieldset>

    </form>


    <!-- =========================
         ÁREA ADMINISTRATIVA
         Fica escondida até verificar
         se o usuário é o administrador.
    ========================== -->

    <div id="areaAdmin" style="display: none;">

        <!-- ALTERAR -->

        <form id="formAlterar">

            <fieldset id="alterar">

                <legend>
                    ADMINISTRADOR - ALTERAR REGISTRO
                </legend>

                <p>

                    <label for="alterarUsuario">
                        Escolha o usuário:
                    </label>

                    <select
                        id="alterarUsuario"
                        required
                    >

                        <option value="">
                            Carregando usuários...
                        </option>

                    </select>

                </p>

                <center>

                    <button
                        type="submit"
                        id="btnAlterar"
                    >
                        ALTERAR REGISTRO
                    </button>

                </center>

            </fieldset>

        </form>


        <!-- DELETAR -->

        <form id="formDelete">

            <fieldset id="delete">

                <legend>
                    ADMINISTRADOR - DELETAR REGISTRO
                </legend>

                <p>

                    <label for="deleteUsuario">
                        Escolha o usuário:
                    </label>

                    <select
                        id="deleteUsuario"
                        required
                    >

                        <option value="">
                            Carregando usuários...
                        </option>

                    </select>

                </p>

                <center>

                    <button type="submit">
                        DELETAR REGISTRO
                    </button>

                </center>

            </fieldset>

        </form>

    </div>


    <!-- =========================
         FIREBASE
    ========================== -->

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        import {
            getFirestore,
            doc,
            setDoc,
            deleteDoc,
            collection,
            getDocs,
            query,
            where
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        // ==================================================
        // CONFIGURAÇÃO FIREBASE
        // ==================================================

        const firebaseConfig = {

            apiKey: "AIzaSyDTbM_zYLwr48RRTc-Vg075ftqJ5NfwOWQ",

            authDomain:
                "albano-2e9e7.firebaseapp.com",

            projectId:
                "albano-2e9e7",

            storageBucket:
                "albano-2e9e7.firebasestorage.app",

            messagingSenderId:
                "978832727853",

            appId:
                "1:978832727853:web:57663dfe584550eb06fda4"
        };


        // ==================================================
        // UID DO ADMINISTRADOR
        // ==================================================
        //
        // TROQUE SOMENTE ESTA PARTE.
        //
        // Exemplo:
        //
        // const ADMIN_UID = "abc123...";
        //
        // ==================================================

        const ADMIN_UID = "COLOQUE_SEU_UID_AQUI";


        // ==================================================
        // INICIALIZAÇÃO
        // ==================================================

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);


        // ==================================================
        // ELEMENTOS
        // ==================================================

        const areaAdmin =
            document.getElementById("areaAdmin");

        const selectAlterar =
            document.getElementById("alterarUsuario");

        const selectDelete =
            document.getElementById("deleteUsuario");


        // ==================================================
        // SANITIZAÇÃO
        // ==================================================

        function sanitizarTexto(valor) {

            return valor
                .trim()
                .replace(/\s+/g, " ");
        }


        // ==================================================
        // VALIDAÇÃO DO NOME
        // ==================================================

        function validarNome(nome) {

            if (nome.length < 2) {

                return false;
            }

            if (nome.length > 80) {

                return false;
            }

            // Bloqueia caracteres usados para tentar
            // inserir HTML/script no campo.

            if (
                nome.includes("<") ||
                nome.includes(">")
            ) {

                return false;
            }

            return true;
        }


        // ==================================================
        // VALIDAÇÃO DO EMAIL
        // ==================================================

        function validarEmail(email) {

            if (email.length > 120) {

                return false;
            }

            const regex =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            return regex.test(email);
        }


        // ==================================================
        // VALIDAÇÃO DA SENHA
        // ==================================================

        function validarSenha(senha) {

            return (
                senha.length >= 6 &&
                senha.length <= 128
            );
        }


        // ==================================================
        // VERIFICA SE É ADMINISTRADOR
        // ==================================================

        function usuarioEhAdmin(user) {

            return (
                user &&
                user.uid === ADMIN_UID
            );
        }


        // ==================================================
        // CONTROLE DE ACESSO DO ADMIN
        // ==================================================

        onAuthStateChanged(auth, async (user) => {

            // Ninguém logado
            if (!user) {

                areaAdmin.style.display = "none";

                return;
            }


            // Usuário comum
            if (!usuarioEhAdmin(user)) {

                areaAdmin.style.display = "none";

                return;
            }


            // Administrador
            areaAdmin.style.display = "block";

            await carregarUsuarios();
        });


        // ==================================================
        // CADASTRO
        // ==================================================

        document
            .getElementById("formCadastro")
            .addEventListener("submit", async (e) => {

                e.preventDefault();


                const nomeOriginal =
                    document
                        .getElementById("cadastroNome")
                        .value;


                const emailOriginal =
                    document
                        .getElementById("cadastroEmail")
                        .value;


                const senha =
                    document
                        .getElementById("cadastroSenha")
                        .value;


                const nome =
                    sanitizarTexto(nomeOriginal);


                const email =
                    emailOriginal
                        .trim()
                        .toLowerCase();


                // VALIDAÇÕES

                if (!validarNome(nome)) {

                    alert(
                        "Nome inválido. Use entre 2 e 80 caracteres."
                    );

                    return;
                }


                if (!validarEmail(email)) {

                    alert(
                        "Digite um email válido."
                    );

                    return;
                }


                if (!validarSenha(senha)) {

                    alert(
                        "A senha deve possuir entre 6 e 128 caracteres."
                    );

                    return;
                }


                try {

                    // Firebase Authentication cria a conta.
                    //
                    // A senha NÃO é salva no Firestore.

                    const userCredential =
                        await createUserWithEmailAndPassword(
                            auth,
                            email,
                            senha
                        );


                    const user =
                        userCredential.user;


                    // Salva somente os dados necessários.

                    await setDoc(
                        doc(
                            db,
                            "usuarios",
                            user.uid
                        ),
                        {

                            nome: nome,

                            email: email
                        }
                    );


                    alert(
                        "Usuário cadastrado com sucesso!"
                    );


                    document
                        .getElementById("formCadastro")
                        .reset();


                    // Se quem cadastrou for admin,
                    // atualiza a lista.

                    if (
                        auth.currentUser &&
                        usuarioEhAdmin(auth.currentUser)
                    ) {

                        carregarUsuarios();
                    }


                } catch (error) {

                    console.error(error);


                    alert(
                        "Não foi possível realizar o cadastro."
                    );
                }

            });


        // ==================================================
        // LOGIN
        // ==================================================

        document
            .getElementById("formLogin")
            .addEventListener("submit", async (e) => {

                e.preventDefault();


                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim()
                        .toLowerCase();


                const senha =
                    document
                        .getElementById("loginSenha")
                        .value;


                if (!validarEmail(email)) {

                    alert(
                        "Digite um email válido."
                    );

                    return;
                }


                if (!validarSenha(senha)) {

                    alert(
                        "Senha inválida."
                    );

                    return;
                }


                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        senha
                    );


                    window.location.href =
                        "site.html";


                } catch (error) {

                    console.error(error);


                    alert(
                        "Email ou senha incorretos."
                    );
                }

            });


        // ==================================================
        // CARREGAR USUÁRIOS
        // ==================================================

        async function carregarUsuarios() {

            // SEGURANÇA EXTRA:
            // impede chamada se não for admin.

            if (!usuarioEhAdmin(auth.currentUser)) {

                areaAdmin.style.display = "none";

                return;
            }


            try {

                const usuariosRef =
                    collection(
                        db,
                        "usuarios"
                    );


                const resultado =
                    await getDocs(
                        usuariosRef
                    );


                // Limpa os selects

                selectAlterar.innerHTML = "";

                selectDelete.innerHTML = "";


                // Nenhum usuário

                if (resultado.empty) {

                    const opcaoAlterar =
                        document.createElement("option");

                    opcaoAlterar.value = "";

                    opcaoAlterar.textContent =
                        "Nenhum usuário cadastrado";


                    const opcaoDelete =
                        document.createElement("option");

                    opcaoDelete.value = "";

                    opcaoDelete.textContent =
                        "Nenhum usuário cadastrado";


                    selectAlterar.appendChild(
                        opcaoAlterar
                    );

                    selectDelete.appendChild(
                        opcaoDelete
                    );

                    return;
                }


                // Adiciona usuários

                resultado.forEach((usuario) => {

                    const dados =
                        usuario.data();


                    // ALTERAR

                    const opcaoAlterar =
                        document.createElement("option");


                    opcaoAlterar.value =
                        usuario.id;


                    // textContent evita XSS

                    opcaoAlterar.textContent =
                        sanitizarTexto(
                            dados.nome || "Sem nome"
                        )
                        +
                        " - "
                        +
                        (dados.email || "Sem email");


                    selectAlterar.appendChild(
                        opcaoAlterar
                    );


                    // DELETAR

                    const opcaoDelete =
                        document.createElement("option");


                    opcaoDelete.value =
                        usuario.id;


                    opcaoDelete.textContent =
                        sanitizarTexto(
                            dados.nome || "Sem nome"
                        )
                        +
                        " - "
                        +
                        (dados.email || "Sem email");


                    selectDelete.appendChild(
                        opcaoDelete
                    );

                });


            } catch (error) {

                console.error(error);


                selectAlterar.innerHTML = "";

                selectDelete.innerHTML = "";


                const erroAlterar =
                    document.createElement("option");

                erroAlterar.textContent =
                    "Acesso negado ou erro";


                const erroDelete =
                    document.createElement("option");

                erroDelete.textContent =
                    "Acesso negado ou erro";


                selectAlterar.appendChild(
                    erroAlterar
                );

                selectDelete.appendChild(
                    erroDelete
                );
            }
        }


        // ==================================================
        // ALTERAR USUÁRIO
        // ==================================================

        document
            .getElementById("formAlterar")
            .addEventListener("submit", async (e) => {

                e.preventDefault();


                // SEGURANÇA EXTRA

                if (!usuarioEhAdmin(auth.currentUser)) {

                    alert(
                        "Acesso negado."
                    );

                    areaAdmin.style.display = "none";

                    return;
                }


                const uid =
                    selectAlterar.value;


                if (!uid) {

                    alert(
                        "Selecione um usuário."
                    );

                    return;
                }


                const nomeAtual =
                    selectAlterar
                        .options[
                            selectAlterar.selectedIndex
                        ]
                        .text;


                const novoNome =
                    prompt(
                        "Digite o novo nome:"
                    );


                if (novoNome === null) {

                    return;
                }


                const nome =
                    sanitizarTexto(novoNome);


                if (!validarNome(nome)) {

                    alert(
                        "Nome inválido."
                    );

                    return;
                }


                const novoEmail =
                    prompt(
                        "Digite o novo email:"
                    );


                if (novoEmail === null) {

                    return;
                }


                const email =
                    novoEmail
                        .trim()
                        .toLowerCase();


                if (!validarEmail(email)) {

                    alert(
                        "Email inválido."
                    );

                    return;
                }


                try {

                    // Verifica se outro usuário já possui
                    // esse email.

                    const usuariosRef =
                        collection(
                            db,
                            "usuarios"
                        );


                    const consulta =
                        query(
                            usuariosRef,
                            where(
                                "email",
                                "==",
                                email
                            )
                        );


                    const resultado =
                        await getDocs(
                            consulta
                        );


                    let emailDuplicado = false;


                    resultado.forEach((usuario) => {

                        if (
                            usuario.id !== uid
                        ) {

                            emailDuplicado = true;
                        }

                    });


                    if (emailDuplicado) {

                        alert(
                            "Esse email já pertence a outro usuário."
                        );

                        return;
                    }


                    // Atualiza somente os campos permitidos.

                    await setDoc(
                        doc(
                            db,
                            "usuarios",
                            uid
                        ),
                        {

                            nome: nome,

                            email: email

                        },
                        {
                            merge: true
                        }
                    );


                    alert(
                        "Usuário alterado com sucesso!"
                    );


                    await carregarUsuarios();


                } catch (error) {

                    console.error(error);


                    alert(
                        "Não foi possível alterar o usuário."
                    );
                }

            });


        // ==================================================
        // DELETAR USUÁRIO
        // ==================================================

        document
            .getElementById("formDelete")
            .addEventListener("submit", async (e) => {

                e.preventDefault();


                // SEGURANÇA EXTRA

                if (!usuarioEhAdmin(auth.currentUser)) {

                    alert(
                        "Acesso negado."
                    );

                    areaAdmin.style.display = "none";

                    return;
                }


                const uid =
                    selectDelete.value;


                if (!uid) {

                    alert(
                        "Selecione um usuário."
                    );

                    return;
                }


                // Impede o admin de apagar
                // o próprio cadastro do Firestore.

                if (uid === ADMIN_UID) {

                    alert(
                        "O administrador não pode excluir a própria conta por este painel."
                    );

                    return;
                }


                const nome =
                    selectDelete
                        .options[
                            selectDelete.selectedIndex
                        ]
                        .textContent;


                const confirmar =
                    confirm(
                        "Tem certeza que deseja deletar:\n\n"
                        +
                        nome
                        +
                        "?"
                    );


                if (!confirmar) {

                    return;
                }


                try {

                    await deleteDoc(
                        doc(
                            db,
                            "usuarios",
                            uid
                        )
                    );


                    alert(
                        "Usuário deletado com sucesso!"
                    );


                    await carregarUsuarios();


                } catch (error) {

                    console.error(error);


                    alert(
                        "Acesso negado ou erro ao deletar usuário."
                    );
                }

            });

    </script>

</body>

</html>
